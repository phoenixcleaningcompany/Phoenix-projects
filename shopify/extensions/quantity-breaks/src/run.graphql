query RunInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          # A Function cannot read variant cost, so the £20+ cap is stamped on
          # by the catalogue exporter as a variant metafield.
          breakCap: metafield(namespace: "custom", key: "break_cap") {
            value
          }
          product {
            id
            hasTags(tags: ["logo"]) {
              tag
              hasTag
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
