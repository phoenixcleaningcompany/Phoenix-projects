<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" aria-label="Stylised London skyline above the Thames with a plate and cutlery">
          <rect width="520" height="400" rx="6" fill="#1D2433"/>
          <!-- title plate -->
          <rect x="120" y="34" width="280" height="30" rx="3" fill="#2C3040"/>
          <text x="260" y="54" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#C4793A">WHERE TO EAT IN LONDON</text>
          <!-- sky glow -->
          <circle cx="420" cy="150" r="46" fill="#C4793A" opacity="0.10"/>
          <!-- skyline silhouette -->
          <!-- Elizabeth Tower (Big Ben) -->
          <rect x="44" y="150" width="26" height="150" fill="#2C3040"/>
          <rect x="46" y="158" width="22" height="20" fill="#374151"/>
          <polygon points="44,150 57,120 70,150" fill="#374151"/>
          <circle cx="57" cy="166" r="5" fill="#C4793A" opacity="0.7"/>
          <!-- Parliament block -->
          <rect x="74" y="206" width="70" height="94" fill="#262E3D"/>
          <rect x="82" y="216" width="6" height="84" fill="#374151"/><rect x="94" y="216" width="6" height="84" fill="#374151"/><rect x="106" y="216" width="6" height="84" fill="#374151"/><rect x="118" y="216" width="6" height="84" fill="#374151"/><rect x="130" y="216" width="6" height="84" fill="#374151"/>
          <!-- St Paul's dome -->
          <rect x="168" y="214" width="64" height="86" fill="#2C3040"/>
          <path d="M168 214 q32 -46 64 0 Z" fill="#374151"/>
          <rect x="196" y="150" width="8" height="24" fill="#374151"/>
          <circle cx="200" cy="150" r="5" fill="#C4793A" opacity="0.65"/>
          <!-- The Gherkin -->
          <path d="M250 300 Q250 200 268 176 Q286 200 286 300 Z" fill="#262E3D"/>
          <path d="M268 176 Q278 188 282 210" fill="none" stroke="#374151" stroke-width="2"/>
          <line x1="258" y1="220" x2="278" y2="220" stroke="#374151" stroke-width="1.5"/>
          <line x1="256" y1="250" x2="280" y2="250" stroke="#374151" stroke-width="1.5"/>
          <line x1="254" y1="280" x2="282" y2="280" stroke="#374151" stroke-width="1.5"/>
          <!-- The Shard -->
          <polygon points="300,300 318,120 336,300" fill="#2C3040"/>
          <polygon points="300,300 318,120 318,300" fill="#262E3D"/>
          <!-- Tower Bridge towers -->
          <rect x="360" y="210" width="22" height="90" fill="#2C3040"/>
          <rect x="408" y="210" width="22" height="90" fill="#2C3040"/>
          <polygon points="360,210 371,188 382,210" fill="#374151"/>
          <polygon points="408,210 419,188 430,210" fill="#374151"/>
          <path d="M382 232 Q395 252 408 232" fill="none" stroke="#374151" stroke-width="3"/>
          <rect x="382" y="226" width="26" height="6" fill="#374151"/>
          <!-- river -->
          <rect x="0" y="300" width="520" height="58" fill="#26303F"/>
          <path d="M0 312 q26 -6 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0" fill="none" stroke="#C4793A" stroke-width="1.5" opacity="0.25"/>
          <path d="M0 330 q26 -6 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0" fill="none" stroke="#FAFAF7" stroke-width="1" opacity="0.12"/>
          <!-- foreground plate + cutlery -->
          <rect x="0" y="356" width="520" height="44" fill="#1D2433"/>
          <ellipse cx="260" cy="378" rx="62" ry="16" fill="#2C3040"/>
          <ellipse cx="260" cy="378" rx="44" ry="10" fill="none" stroke="#C4793A" stroke-width="1.5" opacity="0.8"/>
          <!-- fork -->
          <g stroke="#C4793A" stroke-width="2.4" stroke-linecap="round" opacity="0.9" fill="none">
            <line x1="176" y1="366" x2="176" y2="392"/>
            <line x1="171" y1="366" x2="171" y2="376"/><line x1="181" y1="366" x2="181" y2="376"/>
          </g>
          <!-- knife -->
          <g stroke="#C4793A" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
            <line x1="346" y1="366" x2="346" y2="392"/>
            <path d="M346 366 q7 6 0 14" fill="none"/>
          </g>
        </svg>