<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" aria-label="Stylised Leeds skyline with Town Hall and a plate and cutlery">
          <rect width="520" height="400" rx="6" fill="#1D2433"/>
          <!-- title plate -->
          <rect x="130" y="34" width="260" height="30" rx="3" fill="#2C3040"/>
          <text x="260" y="54" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#C4793A">WHERE TO EAT IN LEEDS</text>
          <!-- sky glow -->
          <circle cx="110" cy="150" r="46" fill="#C4793A" opacity="0.10"/>
          <!-- mill chimney (industrial heritage) -->
          <rect x="40" y="150" width="14" height="150" fill="#262E3D"/>
          <rect x="38" y="150" width="18" height="8" fill="#374151"/>
          <!-- Leeds Town Hall: base, columns, clock tower, dome -->
          <rect x="74" y="232" width="120" height="68" fill="#262E3D"/>
          <rect x="84" y="244" width="6" height="56" fill="#374151"/><rect x="98" y="244" width="6" height="56" fill="#374151"/><rect x="112" y="244" width="6" height="56" fill="#374151"/><rect x="150" y="244" width="6" height="56" fill="#374151"/><rect x="164" y="244" width="6" height="56" fill="#374151"/><rect x="178" y="244" width="6" height="56" fill="#374151"/>
          <rect x="118" y="150" width="44" height="92" fill="#2C3040"/>
          <rect x="122" y="160" width="36" height="14" fill="#374151"/>
          <!-- clock face -->
          <circle cx="140" cy="196" r="11" fill="#26303F" stroke="#C4793A" stroke-width="1.5" opacity="0.9"/>
          <line x1="140" y1="196" x2="140" y2="189" stroke="#C4793A" stroke-width="1.5"/>
          <line x1="140" y1="196" x2="146" y2="196" stroke="#C4793A" stroke-width="1.5"/>
          <!-- domed cupola -->
          <path d="M118 150 q22 -34 44 0 Z" fill="#374151"/>
          <rect x="137" y="108" width="6" height="14" fill="#374151"/>
          <circle cx="140" cy="108" r="4" fill="#C4793A" opacity="0.7"/>
          <!-- Corn Exchange dome -->
          <rect x="214" y="246" width="78" height="54" fill="#2C3040"/>
          <path d="M214 246 q39 -40 78 0 Z" fill="#374151"/>
          <line x1="232" y1="240" x2="232" y2="262" stroke="#26303F" stroke-width="1"/><line x1="253" y1="234" x2="253" y2="262" stroke="#26303F" stroke-width="1"/><line x1="274" y1="240" x2="274" y2="262" stroke="#26303F" stroke-width="1"/>
          <!-- terrace / arcade block -->
          <rect x="300" y="252" width="60" height="48" fill="#262E3D"/>
          <rect x="308" y="262" width="8" height="38" fill="#374151"/><rect x="324" y="262" width="8" height="38" fill="#374151"/><rect x="340" y="262" width="8" height="38" fill="#374151"/>
          <!-- Bridgewater Place modern tower -->
          <rect x="372" y="138" width="50" height="162" fill="#2C3040"/>
          <rect x="372" y="138" width="50" height="162" fill="none" stroke="#26303F" stroke-width="1"/>
          <polygon points="372,138 422,138 414,122 380,122" fill="#262E3D"/>
          <g stroke="#26303F" stroke-width="1">
            <line x1="372" y1="160" x2="422" y2="160"/><line x1="372" y1="182" x2="422" y2="182"/><line x1="372" y1="204" x2="422" y2="204"/><line x1="372" y1="226" x2="422" y2="226"/><line x1="372" y1="248" x2="422" y2="248"/><line x1="372" y1="270" x2="422" y2="270"/>
            <line x1="389" y1="138" x2="389" y2="300"/><line x1="405" y1="138" x2="405" y2="300"/>
          </g>
          <rect x="378" y="160" width="10" height="14" fill="#C4793A" opacity="0.45"/>
          <rect x="406" y="226" width="10" height="14" fill="#C4793A" opacity="0.3"/>
          <!-- a couple of smaller blocks for depth -->
          <rect x="436" y="206" width="40" height="94" fill="#262E3D"/>
          <rect x="442" y="216" width="6" height="84" fill="#374151"/><rect x="454" y="216" width="6" height="84" fill="#374151"/><rect x="466" y="216" width="6" height="84" fill="#374151"/>
          <!-- river Aire -->
          <rect x="0" y="300" width="520" height="58" fill="#26303F"/>
          <path d="M0 312 q26 -6 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0" fill="none" stroke="#C4793A" stroke-width="1.5" opacity="0.25"/>
          <path d="M0 330 q26 -6 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0" fill="none" stroke="#FAFAF7" stroke-width="1" opacity="0.12"/>
          <!-- foreground plate + cutlery -->
          <rect x="0" y="356" width="520" height="44" fill="#1D2433"/>
          <ellipse cx="260" cy="378" rx="62" ry="16" fill="#2C3040"/>
          <ellipse cx="260" cy="378" rx="44" ry="10" fill="none" stroke="#C4793A" stroke-width="1.5" opacity="0.8"/>
          <!-- fork -->
          <g stroke="#C4793A" stroke-width="2.4" stroke-linecap="round" opacity="0.9" fill="none">
            <line x1="176" y1="366" x2="176" y2="392"/>
            <line x1="171" y1="366" x2="171" y2="376"/><line x1="181" y1="366" x2="181" y2="376"/>
          </g>
          <!-- knife -->
          <g stroke="#C4793A" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
            <line x1="346" y1="366" x2="346" y2="392"/>
            <path d="M346 366 q7 6 0 14" fill="none"/>
          </g>
        </svg>